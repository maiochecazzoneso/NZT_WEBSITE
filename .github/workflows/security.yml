# Controlli di sicurezza bloccanti (docs/architettura_sicurezza_nzt_solutions.md §7).
# Gira su ogni pull request, su ogni push a main e una volta a settimana: una vulnerabilità pubblicata
# dopo l'ultimo commit viene così rilevata anche se il codice non è cambiato.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# Minimo privilegio: il workflow legge soltanto il repository
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2

jobs:
  secrets:
    name: Segreti nel repository (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # l'intera cronologia: un segreto rimosso da un file resta nei commit
          persist-credentials: false
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --redact --no-banner

  app:
    name: Landing — dipendenze, lint, tipi, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installa le dipendenze (lockfile bloccato)
        run: pnpm install --frozen-lockfile
      - name: Vulnerabilità delle dipendenze (alte e critiche)
        run: pnpm audit --audit-level=high
      - name: Lint
        run: pnpm lint
      - name: Controllo dei tipi e build
        run: pnpm build
      - name: Test di sicurezza (unitari e di integrazione)
        run: pnpm test

  frontend-apps:
    name: Portal, Admin & UI — lint, tipi, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installa le dipendenze (lockfile bloccato)
        run: pnpm install --frozen-lockfile
      - name: Lint (@nzt/ui, @nzt/portal, @nzt/admin)
        run: |
          pnpm --filter @nzt/ui lint
          pnpm --filter @nzt/portal lint
          pnpm --filter @nzt/admin lint
      - name: Typecheck (@nzt/ui)
        run: pnpm --filter @nzt/ui typecheck
      - name: Build (@nzt/portal, @nzt/admin)
        run: |
          pnpm build:portal
          pnpm build:admin
      - name: Test (@nzt/portal, @nzt/admin)
        run: |
          pnpm test:portal
          pnpm test:admin

  backend:
    name: Backend API — ruff, mypy, pytest, pip-audit, bandit
    runs-on: ubuntu-latest
    services:
      # Con autenticazione, come Atlas: i test usano gli utenti a privilegio minimo nzt_app /
      # nzt_migrator creati da database/create_roles.py (passo "Utenti MongoDB di prova").
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root_test
        ports: ['57017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Installa dipendenze backend
        working-directory: backend
        run: uv sync --frozen
      - name: Utenti MongoDB di prova (privilegio minimo) e TTL monitor spento
        working-directory: backend
        env:
          NZT_MONGODB_ROOT_URI: mongodb://root:root_test@127.0.0.1:57017/?authSource=admin&directConnection=true
          NZT_DB_NAME: nzt_test
          NZT_MIGRATOR_PASSWORD: nzt_migrator_test
          NZT_APP_PASSWORD: nzt_app_test
        run: |
          uv run python ../database/create_roles.py
          # i test scadono documenti apposta: non devono sparire durante il test
          uv run python -c "import os, pymongo; pymongo.MongoClient(os.environ['NZT_MONGODB_ROOT_URI']).admin.command('setParameter', 1, ttlMonitorEnabled=False)"
      - name: Lint e tipi (ruff + mypy)
        working-directory: backend
        run: |
          uv run ruff check src tests
          uv run mypy src
      - name: Test suite (pytest)
        working-directory: backend
        env:
          NZT_TEST_MONGO_URI: mongodb://127.0.0.1:57017/?directConnection=true
          NZT_TEST_REDIS_URL: redis://127.0.0.1:56379/15
        run: uv run pytest
      - name: Audit dipendenze e SAST (pip-audit + bandit)
        working-directory: backend
        run: |
          uv run --with pip-audit pip-audit
          uv run --with bandit bandit -r src/app -ll

  container:
    name: Immagini container (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurazione dei Dockerfile
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE" config --exit-code 1 /repo/frontend/landing/Dockerfile
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE" config --exit-code 1 /repo/frontend/deploy/web.Dockerfile
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE" config --exit-code 1 /repo/backend/Dockerfile
      - name: Build delle immagini
        run: |
          docker build -f frontend/landing/Dockerfile --build-arg PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA -t nzt-web:ci .
          docker build -f frontend/deploy/web.Dockerfile -t nzt-portal-web:ci .
          docker build -f backend/Dockerfile -t nzt-api:ci backend
      - name: Vulnerabilità delle immagini (alte e critiche)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --exit-code 1 nzt-web:ci
          # Caddy: eccezioni motivate e con scadenza in .trivyignore.caddy (solo per questa immagine)
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo:ro" "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --exit-code 1 --ignorefile /repo/.trivyignore.caddy nzt-portal-web:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --exit-code 1 nzt-api:ci
      - name: L'origine risponde solo con il segreto
        run: |
          secret=$(openssl rand -hex 32)
          docker run -d --name nzt --read-only --cap-drop=ALL --security-opt no-new-privileges \
            -e ORIGIN_VERIFY_SECRET="$secret" -p 127.0.0.1:8080:8080 nzt-web:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Origin-Verify: $secret" http://127.0.0.1:8080/)" = 200
          test "$(docker exec nzt id -u)" = 10001
