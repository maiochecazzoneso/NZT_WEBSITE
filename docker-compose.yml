services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    ports:
      # Solo loopback: il server di sviluppo non deve essere raggiungibile dalla rete locale
      - '127.0.0.1:4321:4321'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
