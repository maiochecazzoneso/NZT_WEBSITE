# Stack completo per provare l'Area Clienti in locale:
#   docker compose up --build
# Home     http://localhost:4321   (pulsante "Area Clienti" -> /accedi)
# Portale  http://localhost:8080
# API      http://localhost:8000/docs
# Admin   http://localhost:8081   (dashboard amministratore, login separato)
# LOGIN DI PROVA (le email devono essere valide: "admin" da solo non passa):
#   admin@example.com   / admin    -> dashboard amministratore (http://localhost:8081)
#   cliente@example.com / cliente  -> Area Clienti normale     (http://localhost:8080/accedi)
# Email di verifica registrazione: nei log dell'API (docker compose logs -f api). Google OAuth non configurato.
# Solo credenziali di PROVA: non riutilizzare in produzione.
name: nzt

services:
  # MongoDB con autenticazione, solo sulla rete interna del compose (nessuna porta pubblicata).
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root_demo
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Utenti a privilegio minimo (database/create_roles.py), poi termina. Le credenziali
  # root restano in questo container: l'API non le vede mai.
  mongo-init:
    build: ./backend
    # Lo script vive in database/ ed e' montato in sola lettura; gira con l'ambiente Python dell'API.
    command: ["python", "/database/create_roles.py"]
    volumes:
      - ./database:/database:ro
    environment:
      NZT_MONGODB_ROOT_URI: mongodb://root:root_demo@mongo:27017/?authSource=admin
      NZT_DB_NAME: nzt
      NZT_MIGRATOR_PASSWORD: nzt_migrator_demo
      NZT_APP_PASSWORD: nzt_app_demo
    depends_on:
      mongo: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # All'avvio: schema MongoDB + account di prova (vedi backend/docker-entrypoint.sh), poi il server.
  api:
    build: ./backend
    environment:
      NZT_ENVIRONMENT: development
      NZT_API_PUBLIC_BASE_URL: http://localhost:8000
      NZT_PORTAL_ORIGINS: http://localhost:8080
      NZT_ADMIN_ORIGINS: http://localhost:8081
      NZT_STORAGE_PUBLIC_ORIGIN: http://localhost:9000
      NZT_MONGODB_URI: mongodb://nzt_app:nzt_app_demo@mongo:27017/?authSource=nzt
      NZT_MONGODB_DATABASE: nzt
      NZT_REDIS_URL: redis://redis:6379/0
      NZT_DIRECT_CLIENT_CONNECTIONS: "true"
      NZT_MAIL_BACKEND: console
      NZT_BOOTSTRAP: "true"
      NZT_SEED_DEV_USERS: "true"
      NZT_BOOTSTRAP_MIGRATIONS_URI: mongodb://nzt_migrator:nzt_migrator_demo@mongo:27017/?authSource=nzt
    ports:
      - "8000:8000"
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  portal:
    build:
      context: .
      dockerfile: frontend/portal/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"

  admin:
    build:
      context: .
      dockerfile: frontend/admin/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8081:80"

  landing:
    build:
      context: .
      dockerfile: frontend/landing/Dockerfile
      args:
        PUBLIC_CLIENT_AREA_URL: http://localhost:8080
        PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA   # chiave di TEST Cloudflare
    environment:
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA   # chiave di TEST Cloudflare
    ports:
      - "4321:8080"

volumes:
  mongodata:
