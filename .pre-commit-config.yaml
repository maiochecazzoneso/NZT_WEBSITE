# Hook pre-commit: blocca il commit se contiene chiavi o segreti
# (docs/architettura_sicurezza_nzt_solutions.md §7).
# Attivazione, una volta per clone:  pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
