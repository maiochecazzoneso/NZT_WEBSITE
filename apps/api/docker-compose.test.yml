# Throwaway PostgreSQL 16 + Redis 7 for the test-suite (TEST ONLY credentials).
#   docker compose -f docker-compose.test.yml up -d
#   uv run pytest
#   docker compose -f docker-compose.test.yml down -v
# Same endpoints as scripts/test-services.sh: Postgres 127.0.0.1:55432, Redis 127.0.0.1:56379.
name: nzt-api-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_test
      POSTGRES_DB: postgres
      ROLES_SQL_FILE: /nzt-sql/roles.sql
      NZT_DB_NAME: nzt_test
      NZT_MIGRATOR_PASSWORD: nzt_migrator_test
      NZT_APP_PASSWORD: nzt_app_test
    command: ["postgres", "-c", "fsync=off"]
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./scripts/db/roles.sql:/nzt-sql/roles.sql:ro
      - ./scripts/db/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nzt_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
