# Throwaway MongoDB 8 + Redis 7 for the test-suite (TEST ONLY credentials).
#   docker compose -f docker-compose.test.yml up -d --wait
#   uv run pytest
#   docker compose -f docker-compose.test.yml down -v
# Same endpoints as scripts/test-services.sh: MongoDB 127.0.0.1:57017 (db nzt_test, users
# nzt_migrator / nzt_app created by mongo-init), Redis 127.0.0.1:56379.
name: nzt-api-test

services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root_test
    # TTL monitor off: documents expired on purpose by a test must not vanish mid-test.
    command: ["mongod", "--setParameter", "ttlMonitorEnabled=false", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:57017:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Least-privilege users (database/create_roles.py), then exits.
  mongo-init:
    build: .
    command: ["python", "/database/create_roles.py"]
    volumes:
      - ../database:/database:ro
    environment:
      NZT_MONGODB_ROOT_URI: mongodb://root:root_test@mongo:27017/?authSource=admin
      NZT_DB_NAME: nzt_test
      NZT_MIGRATOR_PASSWORD: nzt_migrator_test
      NZT_APP_PASSWORD: nzt_app_test
    depends_on:
      mongo: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
